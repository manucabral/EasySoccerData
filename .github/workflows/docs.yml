name: Docs

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] pdoc

      - name: Build docs
        run: >-
          python -W error -m pdoc
          ./esd ./esd/datasets.py ./esd/cache.py ./esd/compatibility.py
          ./esd/dataset_capabilities.py ./esd/normalized
          ./esd/espn ./esd/sofascore ./esd/fbref ./esd/promiedos ./esd/goaloo
          ./esd/scores365 ./esd/understat ./esd/transfermarkt ./esd/besoccer
          -o ./site-docs

      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: site-docs/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site-docs/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
